<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f1df">
  <title>一年级英语 · 随身听</title>
  <style>
    :root{--ink:#23352d;--paper:#f7f1df;--card:#fffdf7;--green:#2f6b50;--green2:#184b37;--orange:#ec713a;--line:#dcd3ba;--muted:#718078;--shadow:0 14px 42px rgba(42,58,47,.12)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif;min-height:100vh;padding-bottom:168px}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.27;background-image:radial-gradient(#52705e 0.65px,transparent .65px);background-size:12px 12px;mask-image:linear-gradient(to bottom,#000,transparent 65%)}
    .wrap{width:min(760px,calc(100% - 28px));margin:auto;position:relative}
    header{padding:42px 0 22px}
    .eyebrow{font:700 12px/1.2 ui-monospace,monospace;letter-spacing:.2em;color:var(--orange);text-transform:uppercase}
    h1{font-size:clamp(34px,8vw,64px);line-height:1;margin:10px 0 12px;letter-spacing:-.05em}
    .intro{margin:0;color:var(--muted);font-size:15px}
    .tools{display:flex;gap:10px;position:sticky;top:0;z-index:4;padding:12px 0;background:linear-gradient(var(--paper) 74%,transparent)}
    .search{flex:1;border:1px solid var(--line);background:rgba(255,253,247,.92);border-radius:15px;padding:13px 15px;font:600 15px inherit;color:var(--ink);outline:none;box-shadow:0 5px 18px rgba(42,58,47,.05)}
    .search:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,107,80,.12)}
    .count{display:grid;place-items:center;min-width:62px;border-radius:15px;background:var(--green);color:#fff;font:700 12px ui-monospace,monospace}
    .units{display:grid;gap:12px;margin-top:8px}
    .unit{background:rgba(255,253,247,.86);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 22px rgba(42,58,47,.05)}
    .unit summary{list-style:none;cursor:pointer;padding:18px 18px;display:flex;align-items:center;gap:12px;font-weight:800}
    .unit summary::-webkit-details-marker{display:none}
    .unit summary:after{content:"＋";margin-left:auto;color:var(--orange);font:600 21px sans-serif;transition:.2s transform}
    .unit[open] summary:after{transform:rotate(45deg)}
    .badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#dfe9d9;color:var(--green2);font:800 12px ui-monospace,monospace;flex:0 0 auto}
    .tracks{border-top:1px solid var(--line);padding:7px}
    .track{width:100%;border:0;background:transparent;color:var(--ink);display:grid;grid-template-columns:40px 1fr 26px;gap:6px;align-items:center;text-align:left;padding:10px 9px;border-radius:12px;font:600 14px/1.35 inherit;cursor:pointer}
    .track:hover,.track:focus-visible{background:#eef2e5;outline:none}
    .track.active{background:var(--green);color:#fff}
    .num{font:700 11px ui-monospace,monospace;color:var(--muted)}
    .active .num{color:#dbeade}.playmark{font:16px sans-serif;text-align:center;color:var(--orange)}.active .playmark{color:#fff}
    .empty{text-align:center;color:var(--muted);padding:50px 10px;display:none}
    .player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(24,75,55,.97);color:#fff;box-shadow:0 -12px 45px rgba(20,52,39,.25);padding:13px max(16px,env(safe-area-inset-right)) calc(13px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));backdrop-filter:blur(14px)}
    .player-inner{width:min(760px,100%);margin:auto;display:grid;grid-template-columns:44px 1fr 44px;gap:12px;align-items:center}
    .round{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px;background:var(--orange);color:#fff}
    .round.secondary{background:rgba(255,255,255,.13);font-size:15px}
    .now{min-width:0}.now-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now-unit{font:600 11px ui-monospace,monospace;color:#bcd0c5;margin-top:2px}
    audio{width:min(760px,100%);height:35px;display:block;margin:8px auto 0;filter:saturate(.7)}
    .foot{text-align:center;color:#89978f;font-size:12px;padding:34px 0}
    @media(min-width:700px){.units{grid-template-columns:1fr 1fr}.unit:first-child{grid-column:1/-1}.player-inner{grid-template-columns:48px 1fr 48px}.round{width:48px;height:48px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><div class="eyebrow">English · Grade One</div><h1>一年级英语<br>随身听</h1><p class="intro">按单元打开，点一下就能播放。</p></header>
    <div class="tools"><input id="search" class="search" type="search" placeholder="搜索 Unit、Song、单词……" aria-label="搜索音频"><div id="count" class="count">0 首</div></div>
    <section id="units" class="units"></section><div id="empty" class="empty">没有找到匹配的音频</div>
    <div class="foot">教材配套音频 · 保留原始目录结构</div>
  </main>
  <aside class="player">
    <div class="player-inner"><button id="prev" class="round secondary" aria-label="上一首">◀</button><div class="now"><div id="nowTitle" class="now-title">请选择一首音频</div><div id="nowUnit" class="now-unit">READY TO LISTEN</div></div><button id="next" class="round secondary" aria-label="下一首">▶</button></div>
    <audio id="audio" controls preload="metadata"></audio>
  </aside>
  <script src="manifest.js"></script>
  <script>
    const audio=document.querySelector('#audio'), unitsEl=document.querySelector('#units'), search=document.querySelector('#search');
    const nowTitle=document.querySelector('#nowTitle'), nowUnit=document.querySelector('#nowUnit'), count=document.querySelector('#count'), empty=document.querySelector('#empty');
    let current=-1, visible=window.AUDIO_TRACKS||[];
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(q=''){
      const needle=q.trim().toLowerCase(); visible=AUDIO_TRACKS.filter(t=>(t.title+' '+t.unit).toLowerCase().includes(needle));
      const groups=Object.groupBy?Object.groupBy(visible,t=>t.unit):visible.reduce((a,t)=>((a[t.unit]??=[]).push(t),a),{});
      unitsEl.innerHTML=Object.entries(groups).map(([unit,tracks],gi)=>`<details class="unit" ${needle||gi===0?'open':''}><summary><span class="badge">${String(gi+1).padStart(2,'0')}</span><span>${esc(unit)}</span><small>${tracks.length} 首</small></summary><div class="tracks">${tracks.map(t=>{const i=AUDIO_TRACKS.indexOf(t);return `<button class="track ${i===current?'active':''}" data-i="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span>${esc(t.title)}</span><span class="playmark">▷</span></button>`}).join('')}</div></details>`).join('');
      count.textContent=visible.length+' 首'; empty.style.display=visible.length?'none':'block';
      document.querySelectorAll('.track').forEach(b=>b.onclick=()=>play(+b.dataset.i));
    }
    function play(i){if(i<0||i>=AUDIO_TRACKS.length)return;current=i;const t=AUDIO_TRACKS[i];audio.src=t.src;nowTitle.textContent=t.title;nowUnit.textContent=t.unit;render(search.value);audio.play().catch(()=>{});document.querySelector('.track.active')?.scrollIntoView({block:'nearest',behavior:'smooth'});}
    function step(d){play((current<0?0:(current+d+AUDIO_TRACKS.length)%AUDIO_TRACKS.length))}
    search.oninput=()=>render(search.value);document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);audio.onended=()=>step(1);render();
  </script>
</body>
</html>
